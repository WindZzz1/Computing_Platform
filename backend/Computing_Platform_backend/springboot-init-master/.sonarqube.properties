# SonarQube 配置
# 复制此文件为 sonar-project.properties 并根据需要修改

# 项目标识
sonar.projectKey=computing-platform-backend
sonar.organization=your_organization

# 项目元数据
sonar.projectName=Computing Platform Backend
sonar.projectVersion=1.0.0

# 源代码位置
sonar.sources=src/main/java
sonar.sourceEncoding=UTF-8

# 测试代码位置
sonar.tests=src/test/java
sonar.junit.reportPaths=target/surefire-reports
sonar.jacoco.reportPaths=target/jacoco.exec

# 排除不需要分析的文件
sonar.exclusions=**/generated/**,**/dto/**,**/entity/**,**/config/**,**/model/**
sonar.test.exclusions=**/generated/**

# Java 特定配置
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# 覆盖率阈值
sonar.coverage.minimum=0.50
sonar.qualitygate.wait=true